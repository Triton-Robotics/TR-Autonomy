name: Test Colcon Build
on:
  pull_request:
    branches:
      - main
  push:

jobs:
  build_and_run:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
      
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('requirements/all_requirements.txt') }}
          restore-keys: |
            venv-${{ runner.os }}-
      
      - name: Cache apt packages
        uses: actions/cache@v3
        with:
          path: /var/cache/apt
          key: apt-${{ runner.os }}-${{ hashFiles('src/**/package.xml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install Python Venv (if cache miss)
        if: steps.cache-python-dependencies.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Install python3-venv if not available
          apt-get update
          apt-get install -y python3-venv
          
          # Create virtual environment
          python3 -m venv .venv
          
          # Activate and install dependencies
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements/all_requirements.txt

      - name: Install rosdep dependencies (if cache miss)
        if: steps.cache-apt-packages.outputs.cache-hit != 'true'
        run: |
          # Update rosdep
          apt-get update
          rosdep update
          
          # Install dependencies from all packages in src/
          rosdep install --from-paths src --ignore-src -r -y
      
      - name: Build with colcon
        shell: bash
        run: |
          # Activate venv and source ROS2 and workspace environment
          source .venv/bin/activate
          source /opt/ros/humble/setup.bash
          
          # Make sure build works (ignore hardware specific packages)
          colcon build --packages-ignore \
            camera_node \
            tr-camera-basler \
            lidar_node \
            yolox_ros_cpp \
            yolox_ros \
            yolox_cpp